[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
filterwarnings =
    # Émis par les formulaires de l'admin Django (URLField) en attendant Django 6.
    ignore:The default scheme will be changed:django.utils.deprecation.RemovedInDjango60Warning
    # WhiteNoise : staticfiles/ n'existe qu'après collectstatic (fait dans l'image Docker).
    ignore:No directory at:UserWarning
