# Production, derrière nginx-proxy (réseau net). .env : deploy/setup_env_prod.sh
name: mini-ats

services:
  mini-ats-api:
    container_name: mini-ats-api
    image: ${IMAGE:?IMAGE manquant dans .env}
    restart: unless-stopped
    expose:
      - "8012"
    env_file: .env
    environment:
      - VIRTUAL_HOST=miniats.lemanouthe.com
      - VIRTUAL_PORT=8012
      - LETSENCRYPT_HOST=miniats.lemanouthe.com
      - LETSENCRYPT_EMAIL=mamoutoudoumbia89@gmail.com
    volumes:
      - ./media:/app/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  net:
    external: true
