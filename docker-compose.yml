# Développement. Nom distinct du projet de prod (mini-ats).
name: mini-ats-dev

services:
  api:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py seed_demo && python manage.py runserver 0.0.0.0:8000"
    env_file: ./backend/.env
    environment:
      DATABASE_HOST: host.docker.internal
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
