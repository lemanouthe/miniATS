# L'API utilise le Postgres déjà lancé sur la machine (port 5432),
# configuré via DATABASE_URL dans backend/.env (voir backend/.env.example).
services:
  api:
    build: ./backend
    # migrate + données de démo (idempotent) : aucune étape manuelle après `docker compose up`.
    command: sh -c "python manage.py migrate && python manage.py seed_demo && python manage.py runserver 0.0.0.0:8000"
    env_file: ./backend/.env
    environment:
      # Le .env pointe sur localhost ; depuis le conteneur, la machine hôte est host.docker.internal.
      DATABASE_HOST: host.docker.internal
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
    extra_hosts:
      # host.docker.internal est natif sur Docker Desktop/OrbStack, nécessaire sous Linux.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
